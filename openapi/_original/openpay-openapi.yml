      summary: Add a bank account to a customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBankAccount'
      responses:
        '200':
          description: Bank account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
    get:
      operationId: listBankAccounts
      tags:
        - BankAccounts
      summary: List a customer's bank accounts.
      responses:
        '200':
          description: A list of bank accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankAccount'
  /{merchant_id}/customers/{customer_id}/bankaccounts/{bank_account_id}:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - $ref: '#/components/parameters/CustomerId'
      - name: bank_account_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getBankAccount
      tags:
        - BankAccounts
      summary: Get a bank account by id.
      responses:
        '200':
          description: The bank account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
    delete:
      operationId: deleteBankAccount
      tags:
        - BankAccounts
      summary: Delete a bank account.
      responses:
        '204':
          description: Bank account deleted.
  /{merchant_id}/customers/{customer_id}/payouts:
