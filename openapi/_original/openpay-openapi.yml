        amount:
          type: number
          format: float
        description:
          type: string
        order_id:
          type: string
    Transfer:
      type: object
      properties:
        id:
          type: string
        amount:
          type: number
          format: float
        currency:
          type: string
        status:
          type: string
        description:
          type: string
        order_id:
          type: string
        creation_date:
          type: string
          format: date-time
    CreateFee:
      type: object
      required:
        - customer_id
        - amount
      properties:
        customer_id:
          type: string
          description: Customer whose balance is charged the fee.
        amount:
          type: number
          format: float
        description:
          type: string
        order_id:
          type: string
    Fee:
      type: object
      properties:
        id:
          type: string
        amount:
          type: number
          format: float
        currency:
          type: string
        status:
          type: string
        description:
          type: string
        order_id:
          type: string
        creation_date:
          type: string
          format: date-time
    CreateWebhook:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: HTTPS endpoint that will receive POST notifications.
        user:
          type: string
          description: Optional basic-auth user sent with notifications.
        password:
          type: string
          description: Optional basic-auth password sent with notifications.
        event_types:
          type: array
          items:
            type: string
            enum:
              - charge.refunded
              - charge.failed
              - charge.cancelled
              - charge.created
              - charge.succeeded
              - charge.rescored.to.decline
              - subscription.charge.failed
              - payout.created
              - payout.succeeded
              - payout.failed
              - transfer.succeeded
              - fee.succeeded
              - fee.refund.succeeded
              - spei.received
              - chargeback.created
              - chargeback.rejected
              - chargeback.accepted
              - order.created
              - order.activated
              - order.payment.received
              - order.completed
              - order.expired
              - order.cancelled
              - order.payment.cancelled
              - verification
    Webhook:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        user:
          type: string
        event_types:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - verified
            - unverified
    Error:
      type: object
      properties:
        category:
