  /{merchant_id}/plans/{plan_id}:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPlan
      tags:
        - Plans
      summary: Get a plan by id.
      responses:
        '200':
