meters:
- name: card_transaction_volume
  description: Value of card charges processed, billed as a percentage commission.
  unit: currency
  aggregation: sum
  dimensions:
  - merchant
  - currency
  - card_brand
- name: card_transaction_count
  description: Count of card charges, billed with a fixed per-transaction fee.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - method
- name: store_transaction_count
  description: Count of store/cash (Paynet) payments, billed a flat fee per transaction.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
- name: spei_transaction_count
  description: Count of bank-transfer (SPEI) payments, billed a flat fee per transaction.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
- name: payout_count
  description: Count of payouts sent to bank accounts, billed a per-payout fee.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
- name: refund_count
  description: Count of refunds processed; refund handling and fee retention vary by contract.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
- name: chargeback_count
  description: Count of chargebacks/disputes, which may carry handling fees.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
principles:
- name: Visibility
  description: Pull Openpay transaction reports; break down commission cost by payment method and card brand.
- name: Allocation
  description: Tag charges and payouts with order_id and map merchant accounts to internal cost centers.
- name: Optimization
  description: Steer eligible volume to lower-cost methods (SPEI/store vs. card) where the customer experience allows, and minimize avoidable chargebacks.
- name: Accountability
  description: Reconcile per-method commissions against contract rates monthly and assign owners per merchant account.
