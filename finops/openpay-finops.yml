description: >-
  FinOps view of Openpay processing costs. Openpay's cost is a per-transaction
  commission rather than per-API-call billing: card payments incur a percentage
  plus a fixed fee, store/cash (Paynet) and bank transfer (SPEI) payments incur
  flat per-transaction fees, and payouts incur a per-payout fee. Costs scale with
  payment volume and method mix, vary by country (Mexico, Colombia), and are set
  by the merchant's Openpay / BBVA commercial agreement. Rates here are not
  reconciled against a current published rate card.
notes: >-
  Per-transaction commissions are subject to negotiation and local taxes (e.g.
  IVA in Mexico); verify against the merchant's Openpay contract during
  reconciliation. Track method mix because card vs. SPEI vs. store economics differ.
