aid: openpay
name: Openpay
review:
  question: Does Openpay expose a documented public streaming or WebSocket API?
  answer: false
  date: '2026-06-21'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    Openpay's only event-delivery mechanism is outbound webhooks: the platform
    sends HTTP POST notifications to a merchant-registered HTTPS URL when
    transaction events occur (charge.succeeded, charge.refunded, charge.failed,
    payout.*, chargeback.*, spei.received, order.*, etc.). This is a
    server-to-server callback pattern, not a client-consumed streaming channel,
    and there is no Server-Sent Events (SSE) or WebSocket surface. No AsyncAPI
    document was created because there is no streaming/eventing protocol to model
    beyond the webhook callback, which is captured in the OpenAPI Webhooks paths.
findings:
  summary: |
    Openpay does not publish a documented public WebSocket or streaming API. The
    platform is a conventional REST API scoped per merchant under
    https://api.openpay.mx/v1/{merchant_id} (and the .co domain for Colombia),
    authenticated with HTTP Basic auth using the merchant private key. Event
    notifications are delivered via outbound webhooks (HTTP POST) to a
    merchant-registered URL, which must be verified on registration using a
    verification code Openpay sends to the endpoint. There is no documented
    bidirectional, realtime, or SSE transport.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.openpay.mx/v1
      documented: true
    - protocol: Webhook
      scheme: https
      note: Outbound HTTP POST notifications to a merchant-registered URL; verified via a verification code. Not a client-consumed stream.
      documented: true
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in Openpay's API reference for charges, payouts, or any other resource.
    - protocol: SSE
      scheme: https
      documented: false
      note: No Server-Sent Events streaming endpoint is documented.
