sources:
  - url: https://documents.openpay.mx/docs/api
    type: APIReference
    note: Per-merchant REST base path; all documented endpoints are HTTPS REST.
  - url: https://documents.openpay.mx/docs/webhooks.html
    type: Documentation
    note: Webhooks are outbound HTTP POST notifications with a verification handshake; not WebSocket.
  - url: https://docs.openpay.co/en/docs/api/
    type: APIReference
    note: Colombia reference mirrors the same resource model on the .co domain.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No streaming or WebSocket protocol surface exists. Event delivery is via
    outbound webhooks, which are modeled as REST Webhooks paths in the OpenAPI
    document. No AsyncAPI artifact was authored because there is no SSE or
    WebSocket transport to describe.
