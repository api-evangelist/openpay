aid: openpay
url: https://raw.githubusercontent.com/api-evangelist/openpay/refs/heads/main/apis.yml
name: Openpay
kind: company
description: Openpay is a Mexican and Colombian online payments platform, part of the
  BBVA group, offering a REST API for accepting card payments, cash/store payments,
  and bank transfers (SPEI). The API covers charges, customers, cards, tokens,
  subscriptions, plans, payouts, transfers, fees, and webhooks under a per-merchant
  base path with HTTP Basic authentication using a private API key.
